        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            overflow: hidden;
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 50%, #fef3c7 100%);
        }

        .ball {
            transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            cursor: pointer;
        }

        .ball:active {
            transform: scale(0.9);
        }

        .ball-selected {
            background-color: #f59e0b !important;
            border-color: #b45309 !important;
            color: #ffffff !important;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        .special-selected {
            background-color: #f43f5e !important;
            border-color: #be123c !important;
            color: #ffffff !important;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.4);
        }

        .scroll-container::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .win-card {
            border: 2px solid #fbbf24;
            background-color: #fffbeb;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }

        @keyframes popBadge {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .pop-badge {
            animation: popBadge 0.28s ease-out;
        }
    </style>
</head>

        // ========================
        // 抽題工具（40 題不重複優先隨機抽 10 題）
        // ========================
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function drawQuizSet(isPractice = false) {
            let unseen = QUIZ_BANK.filter(q => !state.drawnHistoryIds.includes(q.id));
            let picked = [];

            if (unseen.length >= QUIZ_DRAW_COUNT) {
                picked = shuffleArray(unseen).slice(0, QUIZ_DRAW_COUNT);
            } else {
                picked = [...unseen];
                const pickedIds = new Set(picked.map(q => q.id));
                state.drawnHistoryIds = [];
                const remainingPool = shuffleArray(QUIZ_BANK.filter(q => !pickedIds.has(q.id)));
                picked = picked.concat(remainingPool.slice(0, QUIZ_DRAW_COUNT - picked.length));
                picked = shuffleArray(picked);
            }

            picked.forEach(q => {
                if (!state.drawnHistoryIds.includes(q.id)) state.drawnHistoryIds.push(q.id);
            });

            state.currentQuizQuestions = picked;
            state.quizUserAnswers = {};
            state.quizAttemptSubmitted = false;
            state.quizAttemptScore = 0;
            state.quizIsPractice = isPractice;

        const LotteryLogic = {
            draw(type, isPlayerAction = false, manualCount = null) {
                switch (type) {
                    case "大樂透": {
                        let b49 = this.sample(1, 49, 7);
                        return {
                            main: b49.slice(0, 6).sort((a, b) => a - b),
                            special: isPlayerAction ? null : b49[6]
                        };
                    }
                    case "威力彩":
                        return { main: this.sample(1, 38, 6).sort((a, b) => a - b), special: Math.floor(Math.random() * 8) + 1 };
                    case "今彩539":
                        return { main: this.sample(1, 39, 5).sort((a, b) => a - b), special: null };
                    case "3星彩":
                        return { main: Array.from({ length: 3 }, () => Math.floor(Math.random() * 10)), special: null };
                    case "4星彩":
                        return { main: Array.from({ length: 4 }, () => Math.floor(Math.random() * 10)), special: null };
                    case "BINGO":
                        return { main: this.sample(1, 80, isPlayerAction ? (manualCount || 10) : 20).sort((a, b) => a - b), special: null };
                }
            },
            sample(min, max, count) {
                let arr = Array.from({ length: max - min + 1 }, (_, i) => i + min);
                return shuffleArray(arr).slice(0, count);
            }
        };

        const PrizeCalculator = {
            calculate(type, player, drawn) {
                const matchCount = (a, b) => a.filter(n => b.includes(n)).length;
                const m = matchCount(player.nums, drawn.main);

                switch (type) {
                    case "大樂透": {
                        let s = player.nums.includes(drawn.special);
                        if (m === 6) return 100000000;
                        if (m === 5 && s) return 2000000;
                        if (m === 5) return 50000;
                        if (m === 4 && s) return 15000;
                        if (m === 4) return 2000;
                        if (m === 3 && s) return 1000;
                        if (m === 3) return 400;
                        if (m === 2 && s) return 400;
                        return 0;
                    }
                    case "威力彩": {
                        let s = player.special === drawn.special;
                        if (m === 6 && s) return 200000000;
                        if (m === 6) return 20000000;
                        if (m === 5 && s) return 150000;
                        if (m === 5) return 20000;
                        if (m === 4 && s) return 4000;
                        if (m === 4) return 800;
                        if (m === 3 && s) return 400;
                        if (m === 3) return 200;
                        if (m === 2 && s) return 200;
                        if (m === 1 && s) return 100;
                        if (m === 0 && s) return 100;
                        return 0;
                    }
                    case "今彩539":
                        if (m === 5) return 8000000;
                        if (m === 4) return 20000;
                        if (m === 3) return 300;
                        if (m === 2) return 50;
                        return 0;
                    case "3星彩": {
                        const p = player.nums;
                        const d = drawn.main;
                        if (p[0] === d[0] && p[1] === d[1] && p[2] === d[2]) return 5000;
                        if (p[1] === d[1] && p[2] === d[2]) return 500;
                        if (p[2] === d[2]) return 50;
                        return 0;
                    }
                    case "4星彩": {
                        const p = player.nums;
                        const d = drawn.main;
                        if (p[0] === d[0] && p[1] === d[1] && p[2] === d[2] && p[3] === d[3]) return 50000;
                        if (p[1] === d[1] && p[2] === d[2] && p[3] === d[3]) return 5000;
                        if (p[2] === d[2] && p[3] === d[3]) return 500;
                        return 0;
                    }
                    case "BINGO":
                        return m >= 5 ? 500 * m : 0;
                }
                return 0;
            }
        };

        function openQuiz() {
            if (state.currentScreen !== 'QUIZ') {
                const safeReturns = ['MAIN_MENU', 'PLAYING', 'RESULTS', 'RULES'];
                state.returnScreen = safeReturns.includes(state.currentScreen) ? state.currentScreen : 'MAIN_MENU';

            if (state.currentQuizQuestions.length === 0) {
                drawQuizSet(state.quizCompleted);

            state.currentScreen = 'QUIZ';
            render();
        }

        function returnFromQuiz() {
            const target = state.returnScreen || 'MAIN_MENU';
            state.currentScreen = target;
            render();
        }

        function getAnsweredQuizCount() {
            return state.currentQuizQuestions.filter(q => (state.quizUserAnswers[q.id] || []).length > 0).length;
        }

        function buildQuizOptionButton(q, opt, isReview) {
            const userAns = state.quizUserAnswers[q.id] || [];
            const isSelected = userAns.includes(opt.v);
            const isMulti = q.type === 'multi';
            const isRightOption = q.answer.includes(opt.v);

            let cardClass = 'border-slate-200 bg-slate-50/50 hover:border-indigo-300 hover:bg-indigo-50/40 text-slate-700';
            let indicatorHtml = '';

            if (isReview) {
                if (isRightOption && isSelected) {
                    cardClass = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-bold';
                    indicatorHtml = '<span class="w-5 h-5 rounded-full bg-emerald-500 text-white text-xs flex items-center justify-center font-black flex-shrink-0">✓</span>';
                } else if (isRightOption && !isSelected) {
                    cardClass = 'border-emerald-400 border-dashed bg-emerald-50/60 text-emerald-900 font-bold';
                    indicatorHtml = '<span class="w-5 h-5 rounded-full border-2 border-emerald-500 text-emerald-600 text-[10px] flex items-center justify-center font-black flex-shrink-0">正</span>';
                } else if (!isRightOption && isSelected) {
                    cardClass = 'border-rose-400 bg-rose-50 text-rose-800 font-medium';
                    indicatorHtml = '<span class="w-5 h-5 rounded-full bg-rose-500 text-white text-xs flex items-center justify-center font-black flex-shrink-0">✕</span>';
                } else {
                    cardClass = 'border-slate-200 bg-slate-50/40 text-slate-400';
                    indicatorHtml = '<span class="w-5 h-5 rounded-full border-2 border-slate-200 flex-shrink-0"></span>';
                }
            } else {
                if (isSelected) {
                    cardClass = isMulti
                        ? 'border-amber-500 bg-amber-50 text-amber-950 font-bold shadow-sm'
                        : 'border-indigo-600 bg-indigo-50 text-indigo-950 font-bold shadow-sm';
                    indicatorHtml = isMulti
                        ? '<span class="w-5 h-5 rounded-md bg-amber-500 text-white text-xs flex items-center justify-center font-black flex-shrink-0">✓</span>'
                        : '<span class="w-5 h-5 rounded-full bg-indigo-600 text-white text-xs flex items-center justify-center font-black flex-shrink-0">●</span>';
                } else {
                    indicatorHtml = isMulti
                        ? '<span class="w-5 h-5 rounded-md border-2 border-slate-300 bg-white flex-shrink-0"></span>'
                        : '<span class="w-5 h-5 rounded-full border-2 border-slate-300 bg-white flex-shrink-0"></span>';
                }
            }

            return `
                <button type="button"
                    id="opt-${q.id}-${opt.v}"
                    ${isReview ? 'disabled' : `onclick="selectQuizOption('${q.id}', '${opt.v}')"`}
                    class="w-full text-left flex items-center gap-3 p-3.5 rounded-xl border-2 transition-all ${cardClass} ${isReview ? 'cursor-default' : 'cursor-pointer active:scale-[0.99]'}">
                    ${indicatorHtml}
                    <span class="w-6 h-6 rounded-lg bg-white border border-slate-200 text-xs font-black text-slate-600 flex items-center justify-center flex-shrink-0">
                        ${opt.v}
                    </span>
                    <span class="text-sm flex-grow leading-snug">${opt.t}</span>
                    ${isReview && isRightOption ? '<span class="text-[11px] font-black text-emerald-600 flex-shrink-0">正確選項</span>' : ''}
                </button>
            `;

        function renderQuiz(container) {

            const questions = state.currentQuizQuestions;
            const isReview = state.quizAttemptSubmitted;
            const answeredCount = getAnsweredQuizCount();
            const pct = Math.round((answeredCount / questions.length) * 100);
            const returnLabelMap = {

                PLAYING: `返回 ${state.selectedGame} 選號`,
                RESULTS: "返回開獎結果",

            container.innerHTML = `

        function selectQuizOption(qId, optVal) {
            if (state.quizAttemptSubmitted) return;
            const q = state.currentQuizQuestions.find(item => item.id === qId);
            if (!q) return;

            const current = state.quizUserAnswers[qId] ? [...state.quizUserAnswers[qId]] : [];
            if (q.type === 'single') {
                state.quizUserAnswers[qId] = [optVal];
            } else {
                const idx = current.indexOf(optVal);
                if (idx >= 0) current.splice(idx, 1);
                else current.push(optVal);
                state.quizUserAnswers[qId] = current.sort();
            }

            // 局部更新該題選項與進度條（不刷新整頁）
            const optsContainer = document.getElementById(`opts-${qId}`);
            if (optsContainer) {
                optsContainer.innerHTML = q.options.map(opt => buildQuizOptionButton(q, opt, false)).join('');
            }

            const card = document.getElementById(`card-${qId}`);
            const hasAns = (state.quizUserAnswers[qId] || []).length > 0;
            if (card && hasAns) {
                card.classList.remove('border-rose-400', 'ring-2', 'ring-rose-200');
                card.classList.add('border-slate-200/80');
            }

            const dot = document.getElementById(`dot-${qId}`);
            if (dot) {
                dot.className = `w-7 h-7 rounded-lg text-xs font-black transition-all ${hasAns ? 'bg-emerald-400 text-indigo-950' : 'bg-white/15 text-white hover:bg-white/30'}`;
            }

            const answeredCount = getAnsweredQuizCount();
            const total = state.currentQuizQuestions.length;
            const pct = Math.round((answeredCount / total) * 100);
            const bar = document.getElementById('quiz-progress-bar');
            const txt = document.getElementById('quiz-progress-text');
            const footer = document.getElementById('quiz-footer-status');
            if (bar) bar.style.width = `${pct}%`;
            if (txt) txt.innerText = `${answeredCount} / ${total} 題`;
            if (footer) footer.innerText = answeredCount === total
                ? `✅ 全部 ${total} 題都填完囉，可以送出了！`
                : `目前已完成 ${answeredCount} / ${total} 題`;
        }

        function scrollToQuizCard(qId) {
            const card = document.getElementById(`card-${qId}`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetQuizAnswers() {
            state.quizUserAnswers = {};
            render();
            showToast("已清除本卷所有作答內容");
        }

        function redrawQuizNow() {
            drawQuizSet(state.quizIsPractice);
            render();
            showToast("已從 40 題題庫重新抽出 10 道新題目！");
        }

        function startPracticeQuiz() {
            drawQuizSet(true);
            render();
            showToast("已抽出 10 道新題目，開始練習吧！");
        }

        function submitQuiz() {
            if (state.quizAttemptSubmitted) return;

            const questions = state.currentQuizQuestions;
            for (let i = 0; i < questions.length; i++) {
                const q = questions[i];
                const ans = state.quizUserAnswers[q.id] || [];
                if (ans.length === 0) {
                    const card = document.getElementById(`card-${q.id}`);
                    if (card) {
                        card.classList.remove('border-slate-200/80');
                        card.classList.add('border-rose-400', 'ring-2', 'ring-rose-200');
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    showToast(`第 ${i + 1} 題尚未作答喔！`);
                    return;
                }
            }

            let correctCount = 0;
            questions.forEach(q => {
                const userAns = [...(state.quizUserAnswers[q.id] || [])].sort();
                const correctAns = [...q.answer].sort();
                if (userAns.length === correctAns.length && userAns.every((v, idx) => v === correctAns[idx])) {
                    correctCount++;
                    if (!state.masteredQuizIds.includes(q.id)) {
                        state.masteredQuizIds.push(q.id);
                    }
                }
            });
            Storage.saveMasteredQuiz();

            state.quizAttemptSubmitted = true;
            state.quizAttemptScore = correctCount;

            if (!state.quizIsPractice && !state.quizCompleted) {
                const bonus = correctCount * 50;
                state.wallet += bonus;
                Storage.saveScore(state.wallet);
                state.quizCompleted = true;
                state.quizScore = correctCount;
                state.quizBonus = bonus;
                showToast(`測驗完成！答對 ${correctCount} / 10 題，獲得 $${bonus} 獎勵！`);
            } else {
                state.quizScore = Math.max(state.quizScore, correctCount);
                showToast(`練習完成！答對 ${correctCount} / 10 題（已精通 ${state.masteredQuizIds.length}/40 題）`);
            }

            render();
        }

            let endingKey = 'ORDINARY_CHARITY';

                if (state.quizCompleted && state.quizScore >= 6) {
                    endingKey = 'RATIONAL_BANKRUPT';
                } else {
                    endingKey = 'GAMBLER_FALLACY';
                }
            } else {
                if (state.wallet >= 100000) {
                    endingKey = 'BILLIONAIRE';
                } else if (state.quizCompleted && state.quizScore >= 8 && state.wallet >= 1000 && state.totalSpent <= 500) {
                    endingKey = 'RATIONAL_MASTER';
                } else if (state.wallet >= 3000) {
                    endingKey = 'LUCKY_WINNER';
                } else {
                    endingKey = 'ORDINARY_CHARITY';
                }

            state.currentEnding = ENDINGS[endingKey];
            state.newlyUnlockedEnding = Storage.unlockEnding(endingKey);
            Storage.saveScore(state.wallet);
            state.currentScreen = 'ENDING';
            render();
        }

                ],
                "威力彩": [
                    ["玩法：第一區 01~38 選 6 號 + 第二區 01~08 選 1 號", "—"],
                    ["第一區 6 號 + 第二區（頭獎）", "$200,000,000"],
                    ["第一區 6 號（貳獎）", "$20,000,000"],
                    ["第一區 5 號 + 第二區（參獎）", "$150,000"],
                    ["第一區 5 號（肆獎）", "$20,000"],
                    ["第一區 4 號 + 第二區（伍獎）", "$4,000"],
                    ["第一區 4 號（陸獎）", "$800"],
                    ["第一區 3 號 + 第二區（柒獎）", "$400"],
                    ["第一區 3 號 或 2 號 + 第二區", "$200"],
                    ["第一區 0~1 號 + 第二區（普獎）", "$100"]
                ],
                "今彩539": [
                    ["玩法：01~39 選 5 個號碼", "—"],
                    ["對中 5 個號碼（頭獎）", "$8,000,000"],
                    ["對中 4 個號碼（貳獎）", "$20,000"],
                    ["對中 3 個號碼（參獎）", "$300"],
                    ["對中 2 個號碼（肆獎）", "$50"]
                ],
                "3星彩": [
                    ["玩法：依序選 3 個數字 (0~9)，每注 $25", "—"],
                    ["3 碼順序全中（壹獎）", "$5,000"],
                    ["末 2 碼對位（貳獎）", "$500"],
                    ["末 1 碼對位（參獎）", "$50"]
                ],
                "4星彩": [
                    ["玩法：依序選 4 個數字 (0~9)，每注 $25", "—"],
                    ["4 碼順序全中（壹獎）", "$50,000"],
                    ["末 3 碼對位（貳獎）", "$5,000"],
                    ["末 2 碼對位（參獎）", "$500"]
                ],
                "BINGO": [
                    ["玩法：01~80 選 1~10 號（每期開出 20 號）", "—"],
                    ["對中 10 號", "$5,000"],
                    ["對中 5 ~ 9 號", "每號 $500"]
                ]
            };

            const data = tables[game] || [];
            return `
                <div class="overflow-hidden border border-slate-200 rounded-xl">
                    <table class="w-full text-sm">
                        <thead class="bg-indigo-50 text-indigo-800">
                            <tr>
                                <th class="p-2.5 text-left">中獎條件</th>
                                <th class="p-2.5 text-right">模擬獎金</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${data.map((row, i) => `
                                <tr class="${i === 0 ? 'bg-slate-50 text-xs font-bold' : ''}">
                                    <td class="p-2.5 text-slate-600">${row[0]}</td>
                                    <td class="p-2.5 text-right font-black ${i === 0 ? 'text-slate-400' : 'text-rose-600'}">${row[1]}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // ========================
        // 互動操作函式（全面無刷新更新）
        // ========================
        function openIntroFromNav() {
            state.introStep = 0;
            changeScreen('INTRO');
        }

        function changeScreen(scr) {
            state.currentScreen = scr;
            if (scr === 'MAIN_MENU') {
                state.playerSelection = [];
                state.playerSpecial = null;
            }
            render();
        }

        function selectGame(game) {
            state.selectedGame = game;
            state.playerSelection = [];
            state.playerSpecial = null;
            state.ticketCount = 1;
            state.manualTicketCount = 1;
            state.currentScreen = 'PLAYING';
            render();
        }

        function adjust(key, val) {
            state[key] = Math.max(1, Math.min(50, state[key] + val));
            updatePlayCountersUI();
        }

        function toggleBall(n) {
            let limit = 6;
            if (state.selectedGame === "今彩539") limit = 5;
            else if (state.selectedGame === "BINGO") limit = 10;

            const ballEl = document.getElementById(`ball-${n}`);
            if (state.playerSelection.includes(n)) {
                state.playerSelection = state.playerSelection.filter(x => x !== n);
                if (ballEl) {
                    ballEl.classList.remove('ball-selected');
                    ballEl.classList.add('bg-slate-50', 'border-slate-200', 'text-slate-700');
                }
            } else {
                if (state.playerSelection.length < limit) {
                    state.playerSelection.push(n);
                    if (ballEl) {
                        ballEl.classList.add('ball-selected');
                        ballEl.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-700');
                    }
                } else {
                    showToast(`${state.selectedGame} 最多只能選 ${limit} 個號碼喔！`);
                }
            }
            updateSelectionDisplayUI();
        }

        function pickSpecialBall(n) {
            if (state.playerSpecial !== null) {
                const prevEl = document.getElementById(`special-ball-${state.playerSpecial}`);
                if (prevEl) {
                    prevEl.classList.remove('special-selected');
                    prevEl.classList.add('bg-white', 'border-rose-200', 'text-rose-700');
                }
            }
            state.playerSpecial = n;
            const curEl = document.getElementById(`special-ball-${n}`);
            if (curEl) {
                curEl.classList.add('special-selected');
                curEl.classList.remove('bg-white', 'border-rose-200', 'text-rose-700');
            }
        }

        function pickStarNum(n) {
            let limit = state.selectedGame === "3星彩" ? 3 : 4;
            if (state.playerSelection.length < limit) {
                state.playerSelection.push(n);
                updateSelectionDisplayUI();
            } else {
                showToast(`${state.selectedGame} 的 ${limit} 位數字已填滿！`);
            }
        }

        function clearCurrentSelection() {
            state.playerSelection.forEach(n => {
                const ballEl = document.getElementById(`ball-${n}`);
                if (ballEl) {
                    ballEl.classList.remove('ball-selected');
                    ballEl.classList.add('bg-slate-50', 'border-slate-200', 'text-slate-700');
                }
            });
            if (state.playerSpecial !== null) {
                const spEl = document.getElementById(`special-ball-${state.playerSpecial}`);
                if (spEl) {
                    spEl.classList.remove('special-selected');
                    spEl.classList.add('bg-white', 'border-rose-200', 'text-rose-700');
                }
            }
            state.playerSelection = [];
            state.playerSpecial = null;
            updateSelectionDisplayUI();
        }

        function addAutoToCart() {
            let currentPickCount = state.playerSelection.length;
            if (state.selectedGame === "今彩539") currentPickCount = 5;
            else if (state.selectedGame === "BINGO") currentPickCount = currentPickCount > 0 ? currentPickCount : 10;
            else if (state.selectedGame === "3星彩") currentPickCount = 3;
            else if (state.selectedGame === "4星彩") currentPickCount = 4;
            else currentPickCount = 6;

            for (let i = 0; i < state.ticketCount; i++) {
                const autoDrawn = LotteryLogic.draw(state.selectedGame, true, currentPickCount);
                state.cart.push({
                    type: state.selectedGame,
                    nums: autoDrawn.main,
                    special: autoDrawn.special,
                    isAuto: true
                });
            }

            showToast(`已機選 ${state.ticketCount} 張 ${state.selectedGame} 加入購物車！`);
            updatePlaySidebarCart(true);
        }

        function addManualToCart() {
            let minReq = 6;
            if (state.selectedGame === "今彩539") minReq = 5;
            else if (state.selectedGame === "3星彩") minReq = 3;
            else if (state.selectedGame === "4星彩") minReq = 4;
            else if (state.selectedGame === "BINGO") minReq = 1;

            if (state.playerSelection.length < minReq) {
                showToast(`${state.selectedGame} 最少需選 ${minReq} 個號碼！`);
                return;
            }

            if (state.selectedGame === "威力彩" && state.playerSpecial === null) {
                showToast("請選擇威力彩第二區特別號 (1 ~ 8)！");
                return;
            }

            for (let i = 0; i < state.manualTicketCount; i++) {
                state.cart.push({
                    type: state.selectedGame,
                    nums: ["3星彩", "4星彩"].includes(state.selectedGame)
                        ? [...state.playerSelection]
                        : [...state.playerSelection].sort((a, b) => a - b),
                    special: state.selectedGame === "威力彩" ? state.playerSpecial : null,
                    isAuto: false
                });
            }

            showToast(`已加入 ${state.manualTicketCount} 張自選 ${state.selectedGame}！`);
            clearCurrentSelection();
            updatePlaySidebarCart(true);
        }

        function deleteCartItem(idx) {
            state.cart.splice(idx, 1);
            showToast('已從購物車移除此張彩券');
            updateMainCartUI();
        }

        function clearCart() {
            state.cart = [];
            showToast('已清空購物車');
            updateMainCartUI();
        }

        function checkout() {
            if (state.cart.length === 0) {
                showToast("購物車是空的，請先挑選彩券號碼喔！");
                return;
            }

            const totalCost = getCartTotalCost();
            if (state.wallet < totalCost) {
                showToast(`餘額不足！購物車總計 $${totalCost.toLocaleString()}，目前僅有 $${state.wallet.toLocaleString()}`);
                return;
            }

            let finalTickets = [...state.cart];
            const drawnPool = {};
            const activeGames = [...new Set(finalTickets.map(t => t.type))];
            activeGames.forEach(g => {
                drawnPool[g] = LotteryLogic.draw(g, false);
            });

            let totalWon = 0;
            finalTickets.forEach(t => {
                t.prize = PrizeCalculator.calculate(t.type, t, drawnPool[t.type]);
                totalWon += t.prize;
            });

            state.wallet = state.wallet - totalCost + totalWon;
            state.totalSpent += totalCost;
            state.totalWon += totalWon;
            state.ticketsBought += finalTickets.length;
            Storage.saveScore(state.wallet);

            const currentRoundNum = state.round;
            state.round += 1;

            state.lastResults = {
                tickets: finalTickets,
                totalCost,
                totalWon,
                drawnPool,
                roundNumber: currentRoundNum
            };

            state.cart = [];
            changeScreen('RESULTS');
        }

        function resetGame() {
            state.wallet = 1000;
            state.round = 1;
            state.totalSpent = 0;
            state.totalWon = 0;
            state.ticketsBought = 0;
            state.cart = [];
            state.playerSelection = [];
            state.playerSpecial = null;
            state.lastResults = null;
            state.quizCompleted = false;
            state.quizScore = 0;
            state.quizBonus = 0;
            state.currentQuizQuestions = [];
            state.quizUserAnswers = {};
            state.quizAttemptSubmitted = false;
            state.quizAttemptScore = 0;
            state.quizIsPractice = false;
            state.currentEnding = null;
            state.newlyUnlockedEnding = false;
            state.currentScreen = 'MAIN_MENU';
            showToast("已領取新的 $1,000 娛樂預算，展開新一輪 7 日試煉！");
            render();
        }

        // 初始化載入
        Storage.load();
        render();
    </script>
</body>

</html>
